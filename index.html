        <style>
            .staticrypt-hr {
                margin-top: 20px;
                margin-bottom: 20px;
                border: 0;
                border-top: 1px solid #eee;
            }

            .staticrypt-page {
                width: 360px;
                padding: 8% 0 0;
                margin: auto;
                box-sizing: border-box;
            }

            .staticrypt-form {
                position: relative;
                z-index: 1;
                background: #ffffff;
                max-width: 360px;
                margin: 0 auto 100px;
                padding: 45px;
                text-align: center;
                box-shadow: 0 0 20px 0 rgba(0, 0, 0, 0.2), 0 5px 5px 0 rgba(0, 0, 0, 0.24);
            }

            .staticrypt-form input[type="password"],
            input[type="text"] {
                background: inherit;
                border: 0;
                box-sizing: border-box; /* This ensures padding is included in the total width */
                font-size: 14px;
                outline: 0;
                padding: 15px 30px 15px 15px; /* Adjust the padding to ensure there is space for the icon */
                width: 100%;
            }

            .staticrypt-password-container {
                position: relative;
                outline: 0;
                background: #f2f2f2;
                width: 100%;
                border: 0;
                margin: 0 0 15px;
                box-sizing: border-box;
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                opacity: 60%;
                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: uppercase;
                outline: 0;
                background: #3DDC97;
                width: 100%;
                border: 0;
                padding: 15px;
                color: #ffffff;
                font-size: 14px;
                cursor: pointer;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: #3DDC97;
                filter: brightness(92%);
            }

            .staticrypt-html {
                height: 100%;
            }

            .staticrypt-body {
                height: 100%;
                margin: 0;
            }

            .staticrypt-content {
                height: 100%;
                margin-bottom: 1em;
                background: #0B0F14;
                font-family: "Arial", sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            .staticrypt-instructions {
                margin-top: -1em;
                margin-bottom: 1em;
            }

            .staticrypt-title {
                font-size: 1.5em;
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                margin-bottom: 1em;
            }

            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.5);
                margin-right: 1em;
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                vertical-align: text-bottom;
                border: 0.25em solid gray;
                border-right-color: transparent;
                border-radius: 50%;
                -webkit-animation: spinner-border 0.75s linear infinite;
                animation: spinner-border 0.75s linear infinite;
                animation-duration: 0.75s;
                animation-timing-function: linear;
                animation-delay: 0s;
                animation-iteration-count: infinite;
                animation-direction: normal;
                animation-fill-mode: none;
                animation-play-state: running;
                animation-name: spinner-border;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                input[type="text"] {
                    font-size: 16px;
                }
            }

            /* Major Muscle dark theme — App Store unlock */
            html.staticrypt-html, body.staticrypt-body {
                background: #0B0F14 !important;
                min-height: 100%;
                min-height: 100dvh;
            }
            .staticrypt-content {
                display: flex !important;
                align-items: center;
                justify-content: center;
                min-height: 100%;
                min-height: 100dvh;
                padding: max(24px, env(safe-area-inset-top, 0px)) 20px max(24px, env(safe-area-inset-bottom, 0px));
                box-sizing: border-box;
                font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, Roboto, sans-serif !important;
                -webkit-font-smoothing: antialiased;
            }
            .staticrypt-page {
                width: 100% !important;
                max-width: 390px;
                padding: 0 !important;
                margin: 0 auto !important;
            }
            .staticrypt-form {
                background: #151C26 !important;
                border: 0.5px solid rgba(255,255,255,0.08);
                border-radius: 24px;
                color: #F4F7FB;
                box-shadow: 0 16px 48px rgba(0,0,0,0.45);
                max-width: none !important;
                margin: 0 !important;
                padding: 36px 28px 28px !important;
            }
            .staticrypt-instructions { margin: 0 0 8px !important; }
            .staticrypt-instructions p.staticrypt-title, .staticrypt-title {
                color: #F4F7FB !important;
                font-weight: 700 !important;
                font-size: 28px !important;
                letter-spacing: -0.02em;
                margin: 16px 0 8px !important;
            }
            .staticrypt-instructions p { color: #9AA6B5 !important; font-size: 15px; line-height: 1.4; margin: 0; }
            .staticrypt-hr { display: none !important; }
            .staticrypt-password-container {
                background: #0B0F14 !important;
                border-radius: 14px;
                border: 0.5px solid rgba(255,255,255,0.10);
                margin: 22px 0 14px !important;
                overflow: hidden;
            }
            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                color: #F4F7FB !important;
                font-size: 17px !important;
                padding: 16px 44px 16px 16px !important;
            }
            .staticrypt-form .staticrypt-decrypt-button {
                border-radius: 14px !important;
                font-weight: 700 !important;
                font-size: 17px !important;
                letter-spacing: 0;
                text-transform: none !important;
                color: #062417 !important;
                padding: 16px !important;
                margin-top: 6px;
            }
            .staticrypt-remember {
                color: #9AA6B5 !important;
                justify-content: flex-start !important;
                font-size: 14px !important;
                margin: 0 0 16px !important;
            }
            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.15);
                accent-color: #3DDC97;
                margin-right: 10px !important;
            }
            .staticrypt-toggle-password-visibility { filter: invert(1); opacity: 0.65; }
            .staticrypt-spinner { border-color: #3DDC97; border-right-color: transparent; }
            .staticrypt-spinner-container { background: #0B0F14; }
            .mm-logo {
                width: 72px; height: 72px; margin: 0 auto 4px;
                border-radius: 18px; overflow: hidden;
                box-shadow: 0 8px 24px rgba(61,220,151,0.18);
            }
            .mm-logo img { width: 100%; height: 100%; display: block; }

        </style>
